<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boost 2 — Nova Solution | King Social Hub</title><meta name="theme-color" content="#16a34a"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/css/layout-polish.css"><style>.wrap{max-width:1050px;margin:28px auto;padding:18px}.head{padding:22px;border-radius:18px;background:linear-gradient(135deg,#064e3b,#16a34a);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}.svc{padding:18px;border:1px solid var(--border,#ddd);border-radius:15px;background:var(--card,#fff)}.svc button{width:100%;padding:11px;background:#16a34a;color:#fff;border:0;border-radius:9px;font-weight:700}.svc input{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #bbb;border-radius:8px;box-sizing:border-box}.muted{opacity:.75;font-size:13px}</style></head><body><main class="wrap"><p><a href="/boost">← All boosting providers</a></p><header class="head"><h1>Boost 2</h1><p>Powered by Nova Solution · Social media growth services</p></header><div id="status" role="status" style="margin:16px 0">Loading Nova Solution services…</div><section id="services" class="grid"></section></main><script>
const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/boost2/services',{credentials:'same-origin'});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load services');const list=d.services||[];document.getElementById('status').textContent=list.length?`${list.length} Nova Solution services available.`:'No priced services are available yet. The administrator must configure prices in Admin → Boosting → Boost 2.';document.getElementById('services').innerHTML=list.map(s=>`<article class="svc"><h3>${esc(s.name)}</h3><p class="muted">${esc(s.category)} · Min ${s.min} · Max ${s.max}</p><p><b>${money(s.price)}</b> per 1,000</p><label>Quantity<input type="number" id="q${s.id}" min="${s.min}" max="${s.max}" value="${s.min}"></label><label>Post / profile URL<input type="url" id="l${s.id}" placeholder="https://…"></label><button onclick="buy(${s.id},${s.min},${s.max})">Place order</button></article>`).join('');}catch(e){document.getElementById('status').textContent=e.message+' Sign in and try again, or contact support.'}}
async function buy(id,min,max){const quantity=Number(document.getElementById('q'+id).value),link=document.getElementById('l'+id).value.trim();if(!Number.isInteger(quantity)||quantity<min||quantity>max)return alert(`Quantity must be ${min}–${max}.`);if(!/^https?:\/\//i.test(link))return alert('Enter a valid public link.');if(!confirm('Place this Boost 2 order and deduct the price from your wallet?'))return;try{const r=await fetch('/api/boost2/orders',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({serviceId:id,quantity,link})});const d=await r.json();if(!r.ok)throw Error(d.error||'Order failed');alert(`Order submitted. Status: ${d.status}. Amount paid: ${money(d.amountPaid)}. Order: ${d.order||'submitted'}`);load()}catch(e){alert(e.message)}}load();</script></body></html>
